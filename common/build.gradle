plugins { id 'dev.architectury.loom' }
dependencies {
    minecraft libs.minecraft
    mappings loom.officialMojangMappings()
    compileOnly libs.fabric.loader
    compileOnly libs.mixin
    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.launcher
}
tasks.named('jar') { archiveFileName = "${rootProject.archives_base_name}-${project.version}-common.jar" }

loom { accessWidenerPath=rootProject.file('common/src/main/resources/seamlessrowing.accesswidener') }
