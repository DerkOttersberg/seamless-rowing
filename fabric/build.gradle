plugins { id 'dev.architectury.loom' }
sourceSets.main {
    java.srcDir rootProject.file('common/src/main/java')
    java.srcDir rootProject.file('loader-adapters/src/main/java')
    resources.srcDir rootProject.file('common/src/main/resources')
}
dependencies {
    minecraft libs.minecraft
    mappings loom.officialMojangMappings()
    modImplementation libs.fabric.loader
    modImplementation libs.fabric.api
    modCompileOnly libs.modmenu
    modCompileOnly('maven.modrinth:entity-model-features:VeoAKvQ0') { transitive=false }
    modCompileOnly('maven.modrinth:entitytexturefeatures:OVZ7HJXt') { transitive=false }
    modCompileOnly('maven.modrinth:first-person-model:UowdyPMu') { transitive=false }
    modCompileOnly('maven.modrinth:not-enough-animations:P5COwDnM') { transitive=false }
    modCompileOnly('maven.modrinth:real-camera:ERGbfBFO') { transitive=false }
    modCompileOnly('maven.modrinth:player-animation-library:tDcfU8FO') { transitive=false }
    modCompileOnly('maven.modrinth:playeranimator:CkedfDp3') { transitive=false }
}
loom {
    accessWidenerPath=rootProject.file('common/src/main/resources/seamlessrowing.accesswidener')
    mixin { useLegacyMixinAp=true; defaultRefmapName='seamlessrowing.refmap.json' }
    mods { seamlessrowing { sourceSet sourceSets.main } }
}
processResources { inputs.property 'version',project.version; filesMatching('fabric.mod.json') { expand version:project.version } }
tasks.named('jar') {
    from rootProject.file('LICENSE')
    duplicatesStrategy=DuplicatesStrategy.EXCLUDE
    manifest { attributes 'MixinConfigs':'seamlessrowing.mixins.json,seamlessrowing.compat.mixins.json' }
    archiveFileName="${rootProject.archives_base_name}-${project.version}-fabric-dev.jar"
}
tasks.named('remapJar') { archiveFileName="${rootProject.archives_base_name}-${project.version}-fabric.jar" }
tasks.named('remapSourcesJar') { archiveFileName="${rootProject.archives_base_name}-${project.version}-fabric-sources.jar" }

// Public, compile-only optional action API; its implementation remains in Throw Weapons.
dependencies { compileOnly project(':optional-api-stubs') }
