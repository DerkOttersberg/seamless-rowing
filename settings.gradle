pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.minecraftforge.net/' }
    }
}
plugins { id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0' }
rootProject.name = 'seamless-rowing'
include 'optional-api-stubs', 'common', 'fabric', 'forge', 'neoforge', 'qa', 'qa-forge', 'qa-neoforge'
gradle.beforeProject { project ->
    def platform=project.name.replace('qa-','')
    project.ext.set('loom.platform',platform in ['forge','neoforge']?platform:'fabric')
}
