plugins { id 'dev.architectury.loom' }
dependencies {
    minecraft libs.minecraft
    mappings loom.officialMojangMappings()
    modImplementation libs.fabric.loader
    modImplementation libs.fabric.api
    compileOnly project(':fabric')
    compileOnly project(':common')
}
sourceSets.main.compileClasspath += project(':fabric').sourceSets.main.compileClasspath
loom { accessWidenerPath=rootProject.file('common/src/main/resources/seamlessrowing.accesswidener'); mixin { useLegacyMixinAp=true; defaultRefmapName='rowing-qa.refmap.json' }; mods { rowingqa { sourceSet sourceSets.main } } }
tasks.named('jar') { archiveFileName='seamless-rowing-qa-dev.jar'; manifest { attributes 'MixinConfigs':'rowing-qa.mixins.json' } }
tasks.named('remapJar') { archiveFileName='seamless-rowing-qa.jar' }

dependencies { compileOnly project(':optional-api-stubs') }
