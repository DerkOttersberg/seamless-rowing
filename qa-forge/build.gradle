plugins { id 'dev.architectury.loom' }
dependencies {
    minecraft libs.minecraft
    mappings loom.officialMojangMappings()
    forge libs.forge
    compileOnly project(':forge')
    compileOnly project(':common')
}
sourceSets.main.compileClasspath += project(':forge').sourceSets.main.compileClasspath
sourceSets.main { java { srcDir rootProject.file('qa/src/main/java'); exclude '**/QaFabricClient.java' }; resources { srcDir rootProject.file('qa/src/main/resources'); exclude 'fabric.mod.json' } }
loom { accessWidenerPath=rootProject.file('common/src/main/resources/seamlessrowing.accesswidener'); mixin { useLegacyMixinAp=true; defaultRefmapName='rowing-qa.refmap.json' }; mods { rowingqa { sourceSet sourceSets.main } } }
tasks.named('jar') { archiveFileName='seamless-rowing-qa-forge-dev.jar'; manifest { attributes 'MixinConfigs':'rowing-qa.mixins.json' } }
tasks.named('remapJar') { archiveFileName='seamless-rowing-qa-forge.jar' }
