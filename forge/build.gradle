plugins { id 'dev.architectury.loom' }
sourceSets.main {
    java.srcDir rootProject.file('common/src/main/java')
    java.srcDir rootProject.file('loader-adapters/src/main/java')
    resources.srcDir rootProject.file('common/src/main/resources')
}
dependencies {
    minecraft libs.minecraft
    mappings loom.officialMojangMappings()
    forge libs.forge
    modCompileOnly('maven.modrinth:entity-model-features:6RQ5C1J6') { transitive=false }
    modCompileOnly('maven.modrinth:entitytexturefeatures:VkWikkyj') { transitive=false }
    modCompileOnly('maven.modrinth:first-person-model:kxFDUOmS') { transitive=false }
    modCompileOnly('maven.modrinth:not-enough-animations:kGjMleOz') { transitive=false }
}
loom {
    accessWidenerPath=rootProject.file('common/src/main/resources/seamlessrowing.accesswidener')
    mixin { useLegacyMixinAp=true; defaultRefmapName='seamlessrowing.refmap.json' }
    mods { seamlessrowing { sourceSet sourceSets.main } }
}
loom.getForge().convertAccessWideners(tasks.named('remapJar'), 'seamlessrowing.accesswidener')
processResources { inputs.property 'version',project.version; filesMatching('META-INF/mods.toml') { expand version:project.version } }
tasks.named('jar') {
    from rootProject.file('LICENSE')
    duplicatesStrategy=DuplicatesStrategy.EXCLUDE
    manifest { attributes 'MixinConfigs':'seamlessrowing.mixins.json,seamlessrowing.compat.mixins.json' }
    archiveFileName="${rootProject.archives_base_name}-${project.version}-forge-dev.jar"
}
tasks.named('remapJar') { archiveFileName="${rootProject.archives_base_name}-${project.version}-forge.jar" }
tasks.named('remapSourcesJar') { archiveFileName="${rootProject.archives_base_name}-${project.version}-forge-sources.jar" }

// Compile the shared optional API schemas; these dependencies are never installed or bundled on Forge.
dependencies {
    modCompileOnly('maven.modrinth:real-camera:zxrGLIlw') { transitive=false }
    modCompileOnly('maven.modrinth:playeranimator:xe2EVE6q') { transitive=false }
}

// Public, compile-only optional action API; its implementation remains in Throw Weapons.
dependencies { compileOnly project(':optional-api-stubs') }
