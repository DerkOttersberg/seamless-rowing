plugins { id 'dev.architectury.loom' }
sourceSets.main {
    java.srcDir rootProject.file('common/src/main/java')
    java.srcDir rootProject.file('loader-adapters/src/main/java')
    resources.srcDir rootProject.file('common/src/main/resources')
}
dependencies {
    minecraft libs.minecraft
    mappings loom.officialMojangMappings()
    neoForge libs.neoforge
    modCompileOnly('maven.modrinth:entity-model-features:bRlX1x4e') { transitive=false }
    modCompileOnly('maven.modrinth:entitytexturefeatures:CfQJbv1u') { transitive=false }
    modCompileOnly('maven.modrinth:first-person-model:eaj8cYpD') { transitive=false }
    modCompileOnly('maven.modrinth:not-enough-animations:VCuMsK45') { transitive=false }
    modCompileOnly('maven.modrinth:real-camera:j9j0EChP') { transitive=false }
    modCompileOnly('maven.modrinth:player-animation-library:yjxtkvnD') { transitive=false }
    modCompileOnly('maven.modrinth:playeranimator:HJZB6bmA') { transitive=false }
}
loom {
    accessWidenerPath=rootProject.file('common/src/main/resources/seamlessrowing.accesswidener')
    mixin { useLegacyMixinAp=true; defaultRefmapName='seamlessrowing.refmap.json' }
    mods { seamlessrowing { sourceSet sourceSets.main } }
}
loom.getNeoForge().convertAccessWideners(tasks.named('remapJar'), 'seamlessrowing.accesswidener')
processResources { inputs.property 'version',project.version; filesMatching('META-INF/neoforge.mods.toml') { expand version:project.version } }
tasks.named('jar') {
    from rootProject.file('LICENSE')
    duplicatesStrategy=DuplicatesStrategy.EXCLUDE
    manifest { attributes 'MixinConfigs':'seamlessrowing.mixins.json,seamlessrowing.compat.mixins.json' }
    archiveFileName="${rootProject.archives_base_name}-${project.version}-neoforge-dev.jar"
}
tasks.named('remapJar') { archiveFileName="${rootProject.archives_base_name}-${project.version}-neoforge.jar" }
tasks.named('remapSourcesJar') { archiveFileName="${rootProject.archives_base_name}-${project.version}-neoforge-sources.jar" }
